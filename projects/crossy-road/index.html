<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crossy Road</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #4a9c3f; }
    #game-canvas { display: block; width: 100%; height: 100%; }

    #hud {
      position: fixed;
      inset: 0;
      pointer-events: none;
      font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #fff;
    }

    #score {
      position: absolute;
      top: 18px;
      left: 20px;
      font-size: 44px;
      font-weight: 800;
      text-shadow: 0 3px 0 rgba(0,0,0,0.35);
      letter-spacing: 1px;
    }
    #score .label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      opacity: 0.85;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    #game-over {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(20, 28, 24, 0.88);
      border-radius: 16px;
      padding: 32px 40px;
      text-align: center;
      pointer-events: auto;
      display: none;
      min-width: 260px;
    }
    #game-over.visible { display: block; }
    #game-over h1 { font-size: 30px; margin-bottom: 8px; }
    #game-over .final { font-size: 18px; opacity: 0.9; margin-bottom: 22px; }
    #game-over button {
      pointer-events: auto;
      cursor: pointer;
      border: none;
      border-radius: 10px;
      padding: 12px 26px;
      font-size: 17px;
      font-weight: 700;
      color: #1c2a20;
      background: #ffd23f;
      box-shadow: 0 4px 0 #c79e19;
      transition: transform 0.05s ease;
    }
    #game-over button:active { transform: translateY(2px); box-shadow: 0 2px 0 #c79e19; }

    #hint {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 13px;
      opacity: 0.7;
      text-shadow: 0 2px 0 rgba(0,0,0,0.3);
    }

    #error {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(120, 20, 20, 0.92);
      padding: 20px 26px;
      border-radius: 12px;
      max-width: 80%;
      display: none;
    }
    #error.visible { display: block; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
      }
    }
  </script>
</head>
<body>
  <canvas id="game-canvas"></canvas>
  <div id="hud">
    <div id="score"><span class="label">Score</span><span id="score-value">0</span></div>
    <div id="hint">Arrow keys / WASD to move</div>
    <div id="game-over">
      <h1>Game Over</h1>
      <div class="final">Score: <span id="final-score">0</span></div>
      <button id="restart-btn">Play Again</button>
    </div>
    <div id="error"></div>
  </div>

  <script type="module">
    import { start } from "./src/main.js";
    start().catch((err) => {
      console.error(err);
      const e = document.getElementById("error");
      e.textContent = "Failed to start the game: " + (err && err.message ? err.message : err);
      e.classList.add("visible");
    });
  </script>
</body>
</html>
